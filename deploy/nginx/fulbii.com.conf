# Replace the certificate paths only when your TLS issuer stores them elsewhere.
# This file intentionally has distinct HTTP and HTTPS servers: never serve the
# Laravel application directly over port 80.
server {
    listen 80;
    listen [::]:80;
    server_name fulbii.com www.fulbii.com;
    return 301 https://fulbii.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fulbii.com;

    ssl_certificate /etc/letsencrypt/live/fulbii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fulbii.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/fulbii/current/public;
    index index.php index.html;
    server_tokens off;

    access_log /var/log/nginx/fulbii_access.log;
    error_log /var/log/nginx/fulbii_error.log;

    client_max_body_size 25M;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
    # Start CSP in Report-Only if legacy marketing assets require external hosts.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. { deny all; }
}
